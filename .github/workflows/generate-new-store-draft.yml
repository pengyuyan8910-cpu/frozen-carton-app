name: 新增门店严格排柜草稿
on:
  push:
    branches:
      - master
    paths:
      - 'data/new-store/*.xlsx'
      - 'data/new-store/*.json'
      - 'data/source/*.xlsx'
      - 'scripts/generate-new-store-draft.mjs'
      - 'scripts/strict-allocation-engine.mjs'
      - 'scripts/source-to-app-data.mjs'
      - 'scripts/source-to-app-data-preserve-face.mjs'
      - 'scripts/app-data-to-workbook.mjs'
      - 'package.json'
      - '.github/workflows/generate-new-store-draft.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: frozen-carton-master-writes
  cancel-in-progress: false
jobs:
  generate-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm install
      - name: 识别本次上传的门店配置
        id: config
        shell: bash
        run: |
          file=""
          if [ "${{ github.event_name }}" = "push" ]; then
            file=$(git -c core.quotePath=false diff --name-only --diff-filter=AM "${{ github.event.before }}" "${{ github.sha }}" -- 'data/new-store/*.xlsx' 'data/new-store/*.json' | grep -v -E 'README|模板' | head -n 1 || true)
          fi
          if [ -z "$file" ]; then
            if [ -f 'data/new-store/新增门店配置.json' ]; then
              file='data/new-store/新增门店配置.json'
            elif [ -f 'data/new-store/新增门店配置.xlsx' ]; then
              file='data/new-store/新增门店配置.xlsx'
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "path=$file" >> "$GITHUB_OUTPUT"
      - name: 生成严格排柜草稿
        if: steps.config.outputs.run == 'true'
        env:
          NEW_STORE_CONFIG_PATH: ${{ steps.config.outputs.path }}
        run: npm run generate-new-store-draft
      - name: 提交草稿结果
        if: steps.config.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/drafts
          if git diff --cached --quiet; then
            echo "新增门店草稿没有变化"
          else
            git commit -m "chore: 自动生成新增门店严格排柜草稿"
            git fetch origin master
            git rebase origin/master
            git push origin HEAD:master
          fi
